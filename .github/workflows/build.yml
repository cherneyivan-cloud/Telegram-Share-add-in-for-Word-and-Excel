name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Restore
        run: msbuild TelegramShareAddin.sln /t:Restore /p:Configuration=Release /m

      - name: Build
        run: msbuild TelegramShareAddin.sln /p:Configuration=Release /m /nologo
